name: Python quality

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "example/**"
      - "agents/equity/daily_investment_system/**"
      - "pyproject.toml"
      - "README.md"
      - "uv.lock"
      - ".python-version"
      - ".flake8"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "example/**"
      - "agents/equity/daily_investment_system/**"
      - "pyproject.toml"
      - "README.md"
      - "uv.lock"
      - ".python-version"
      - ".flake8"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked --all-extras

      - name: Tests
        run: uv run pytest tests agents/equity/daily_investment_system/tests -q

      - name: Check RL formatting
        run: uv run black --check src/financial_agent/rl tests/rl src/financial_agent/quant tests/quant

      - name: Lint RL
        run: uv run flake8 src/financial_agent/rl tests/rl src/financial_agent/quant tests/quant

      - name: Type-check RL and harness
        run: uv run mypy src/financial_agent/rl src/financial_agent/harness src/financial_agent/quant

      - name: Build and smoke-test installed wheel outside checkout
        run: |
          uv build
          uvx twine check --strict dist/*
          uv venv /tmp/fa-wheel
          uv pip install --python /tmp/fa-wheel dist/*.whl
          cd /tmp
          /tmp/fa-wheel/bin/fa-quant demo --sessions 3 --state-dir /tmp/fa-wheel-state
          /tmp/fa-wheel/bin/python - <<'PYCODE'
          from importlib.resources import files
          from financial_agent.harness.helpers import load_helper
          from financial_agent.harness.market_calendar import session
          policy = files("financial_agent.quant").joinpath("quant_policy.toml")
          assert policy.is_file(), "wheel is missing quant_policy.toml"
          result = session("2026-10-13")
          assert result.trading_day, result
          print(result)
          scoring = load_helper("factor_scoring")
          assert scoring.read_tickers(["SPY", "SPY"], None) == ["SPY"]
          print("Wheel policy and helper resources verified")
          PYCODE
