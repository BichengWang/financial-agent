name: Release

# Tag pushes create the GitHub release; they also publish to PyPI once the
# repository variable PYPI_PUBLISH is "true". Manual dispatch uploads the
# current ref's build to TestPyPI as a rehearsal. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install all stacks
        run: uv sync --locked --all-extras
      - name: Full tests
        run: uv run pytest tests agents/equity/daily_investment_system/tests -q
      - name: Formatting and lint
        run: |
          uv run black --check src/financial_agent/rl tests/rl src/financial_agent/quant tests/quant
          uv run flake8 src/financial_agent/rl tests/rl src/financial_agent/quant tests/quant
      - name: Types
        run: uv run mypy src/financial_agent/quant src/financial_agent/rl src/financial_agent/harness
      - name: Extract release notes and verify tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("tag must match package version")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[Unreleased\]:|\Z)", text, re.M | re.S)
          if match is None or not match[1].strip():
              raise SystemExit("missing CHANGELOG release section")
          Path("release-notes.md").write_text(match[1].strip() + "\n")
          PY
      - name: Build wheel and sdist
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Install wheel in clean environment
        run: |
          uv venv /tmp/fa-wheel
          uv pip install --python /tmp/fa-wheel dist/*.whl
          cd /tmp
          /tmp/fa-wheel/bin/fa-quant demo --sessions 3 --state-dir /tmp/fa-wheel-state
          /tmp/fa-wheel/bin/python - <<'PYCODE'
          from importlib.resources import files
          from financial_agent.harness.helpers import load_helper
          from financial_agent.harness.market_calendar import session
          policy = files("financial_agent.quant").joinpath("quant_policy.toml")
          assert policy.is_file(), "wheel is missing quant_policy.toml"
          result = session("2026-10-13")
          assert result.trading_day, result
          print(result)
          scoring = load_helper("factor_scoring")
          assert scoring.read_tickers(["SPY", "SPY"], None) == ["SPY"]
          print("Wheel policy and helper resources verified")
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'push' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fa-quant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fa-quant/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can be uploaded only once; reruns of a rehearsal pass.
          skip-existing: true

  github-release:
    needs: [build, pypi]
    # Publishing is optional, but a failed PyPI upload or a cancelled run must
    # not leave a release.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.pypi.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz -R "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
