[project]
name = "financial-agent"
version = "1.2.0"
description = "Risk-managed systematic ETF trading, statistical validation, and financial research"
authors = [{name = "Bicheng (Kenneth)", email = "31808103+BichengWang@users.noreply.github.com"}]
keywords = ["systematic-trading", "portfolio", "backtesting", "risk-management", "reinforcement-learning"]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0,<3",
    "yfinance",
    "gymnasium",
    "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/BichengWang/financial-agent"
Repository = "https://github.com/BichengWang/financial-agent"
Documentation = "https://github.com/BichengWang/financial-agent/tree/main/docs/quant"
Issues = "https://github.com/BichengWang/financial-agent/issues"
Changelog = "https://github.com/BichengWang/financial-agent/blob/main/CHANGELOG.md"

[project.scripts]
fa-quant = "financial_agent.quant.__main__:main"

[project.optional-dependencies]
rl = [
    "stable-baselines3",
    "stockstats",
    "pyfolio-reloaded",
    "matplotlib",
    "beautifulsoup4",
    "scikit-learn",
    # trading/utils/gpu_config.py imports TensorFlow at module load.
    "tensorflow",
]
dl = [
    "tensorflow",
    "keras-nightly",
    "scikit-learn",
    "ipython",
    "matplotlib",
    "seaborn",
]
notebooks = [
    "notebook",
    "ipython",
    "seaborn",
    "matplotlib",
]
dev = [
    "black>=22.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-custom-exit-code",
]
all = [
    "financial-agent[rl,dl,notebooks]",
]
research = [
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_agent"]

[tool.hatch.build.targets.wheel.force-include]
"agents/equity/daily_investment_system/settlement_ledger.py" = "financial_agent/harness/_system/settlement_ledger.py"
"agents/equity/daily_investment_system/factor_scoring.py" = "financial_agent/harness/_system/factor_scoring.py"

[dependency-groups]
dev = [
    "black>=22.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-custom-exit-code",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = ["network: tests requiring external network access"]
addopts = "-m 'not network'"
