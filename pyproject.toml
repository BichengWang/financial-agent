[project]
name = "financial-agent"
version = "0.1.0"
description = "A reinforcement learning framework for financial agents"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0,<3",
    "yfinance",
    "gymnasium",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3",
    "stockstats",
    "pyfolio-reloaded",
    "matplotlib",
    "beautifulsoup4",
    "scikit-learn",
    # trading/utils/gpu_config.py imports TensorFlow at module load.
    "tensorflow",
]
dl = [
    "tensorflow",
    "keras-nightly",
    "scikit-learn",
    "ipython",
    "matplotlib",
    "seaborn",
]
notebooks = [
    "notebook",
    "ipython",
    "seaborn",
    "matplotlib",
]
dev = [
    "black>=22.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-custom-exit-code",
]
all = [
    "financial-agent[rl,dl,notebooks]",
]
research = [
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_agent"]

[dependency-groups]
dev = [
    "black>=22.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-custom-exit-code",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = ["network: tests requiring external network access"]
addopts = "-m 'not network'"
